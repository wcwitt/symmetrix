name: CI

on: [pull_request, workflow_dispatch]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
    - name: Run pre-commit
      run: uvx pre-commit run --all-files

  generate-test-models:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Cache Torch checkpoints
      uses: actions/cache@v4
      with:
        path: checkpoints
        key: torch-checkpoints-${{ hashFiles('.github/generate_ci_models.py') }}
    - name: Generate test models
      run: |
        uv venv
        uv pip install --torch-backend=cpu "torch==2.6.0" "mace-torch==0.3.14" "numpy==1.26.4"
        uv run python .github/generate_ci_models.py
    - name: Upload H/O test models
      uses: actions/upload-artifact@v4
      with:
        name: ci-models
        path: models/*-1-8.json
        if-no-files-found: error
        retention-days: 1
    - name: Upload HEA test model
      uses: actions/upload-artifact@v4
      with:
        name: ci-models-hea
        path: models/*-hea.json
        if-no-files-found: error
        retention-days: 1

  symmetrix:
    needs: generate-test-models
    runs-on: ubuntu-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Check gpu-lite submodule matches sphericart's pin
      run: grep -q "GIT_TAG $(git -C libsymmetrix/external/gpu-lite rev-parse HEAD)" libsymmetrix/external/sphericart/sphericart/CMakeLists.txt
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git libblas-dev liblapack-dev ninja-build
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: '3.12'
    - name: Create python venv and install
      run: |
        uv venv --clear
        source .venv/bin/activate
        uv pip install ./symmetrix[test]
        deactivate
    - name: Download H/O test models
      uses: actions/download-artifact@v5
      with:
        name: ci-models
        path: symmetrix/test
    - name: Run tests
      run: |
        source .venv/bin/activate
        python -c "import symmetrix; print(symmetrix.__version__)"
        cd symmetrix/test
        pytest
        deactivate
        cd ../..

  pair_symmetrix:
    needs: generate-test-models
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lammps-version: [patch_10Sep2025, stable_30Sep2026]
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git libfftw3-dev libopenmpi-dev mpi-default-bin mpi-default-dev libblas-dev liblapack-dev
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: '3.12'
    - name: Create python venv and install
      run: |
        uv venv --clear
        source .venv/bin/activate
        uv pip install pip numpy pytest
        deactivate
    - name: Clone and build LAMMPS
      run: |
        source .venv/bin/activate
        git clone -b ${{ matrix.lammps-version }} --depth 1 https://github.com/lammps/lammps.git
        cd pair_symmetrix
        chmod +x install.sh
        ./install.sh ../lammps
        cd ../lammps
        cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_CXX_STANDARD=20 \
            -D CMAKE_CXX_STANDARD_REQUIRED=ON \
            -D BUILD_SHARED_LIBS=ON \
            -D PKG_KOKKOS=ON \
            -D Kokkos_ENABLE_SERIAL=ON \
            -D Kokkos_ENABLE_OPENMP=ON \
            -D BUILD_OMP=ON \
            -D Kokkos_ARCH_NATIVE=ON \
            -D Kokkos_ENABLE_AGGRESSIVE_VECTORIZATION=ON \
            -D SYMMETRIX_KOKKOS=ON \
            cmake
        cmake --build build -j 4
        cd build
        make install-python
        cd ../../..
    - name: Download test models
      uses: actions/download-artifact@v5
      with:
        pattern: ci-models*
        merge-multiple: true
        path: pair_symmetrix/test
    - name: Run tests
      run: |
        source .venv/bin/activate
        cd pair_symmetrix/test/
        python -m pytest

  extract-mace-model:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - mace-torch: "mace-torch==0.3.10"
          torch: "torch==2.5.*"
        - mace-torch: "mace-torch"
          torch: "torch"
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git libblas-dev liblapack-dev ninja-build
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: '3.12'
    - name: Create python venv and install
      run: |
        uv venv --clear
        source .venv/bin/activate
        uv pip install "${{ matrix.torch }}" "${{ matrix.mace-torch }}" "./symmetrix[mace]"
        deactivate
    - name: Test model extraction
      run: |
        source .venv/bin/activate
        # check for valid symmetrix json from atomic numbers and default filename
        wget https://github.com/ACEsuit/mace-off/raw/refs/heads/main/mace_off23/MACE-OFF23_small.model
        symmetrix_extract_mace --model MACE-OFF23_small.model --atomic-numbers 1 8
        python3 -c "from symmetrix import Symmetrix; calc = Symmetrix('MACE-OFF23_small-1-8.json', species=[1, 8])"
        # check for valid symmetrix json from checmical symbols and specified filename
        wget https://github.com/ACEsuit/mace-off/raw/refs/heads/main/mace_off23/MACE-OFF23_medium.model
        symmetrix_extract_mace --model MACE-OFF23_medium.model --chemical-symbols H O -o extract_test.json
        python3 -c "from symmetrix import Symmetrix; calc = Symmetrix('extract_test.json', species=[1, 8])"
        deactivate

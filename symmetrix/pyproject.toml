[build-system]
requires = ["scikit-build-core>=1.0", "pybind11", "cmake>=3.27"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.27"
build-dir = "build"
wheel.exclude = ["bin/", "lib/", "lib64/", "include/"]
wheel.packages = ["source/symmetrix"]

[project]
name = "symmetrix"
dynamic = ["version"]
description = "Symmetrix — a package for functions equivariant under: translation, rotation, inversion, and exchange of particles."
dependencies = [
    "numpy",
    "scipy",
    "ase",
]

[project.optional-dependencies]
mace = [
    "torch>=2.5",
    "mace-torch",
]
nequip = [
    "torch>=2.5",
    "nequip>=0.19",
]
test = [
    "pytest",
]

[project.scripts]
symmetrix_extract_mace = "symmetrix.cli.extract_mace:main"
symmetrix_extract_nequip = "symmetrix.cli.extract_nequip:main"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "../VERSION"
regex = "(?P<value>.+)"

[tool.ruff]
lint.ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "E402"]
"test_*.py" = ["F811"]
